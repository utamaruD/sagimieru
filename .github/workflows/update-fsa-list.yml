# 金融庁の無登録業者リストを毎月自動で作り直し、rules/fsa-list.json と rules/latest.json を更新する。
# サギミエールのアプリは1日1回 rules/latest.json を見て、新しければダウンロードして使う。
# スクリプトは utamaruD/scam-guard の scripts/ の写し（scripts/publish-rules.mjs で tools/ に入る）。
name: 金融庁の無登録業者リストを更新

on:
  schedule:
    - cron: '0 0 2 * *' # 毎月2日 9:00（日本時間）
  workflow_dispatch: # 手動でも動かせる

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 金融庁のエクセルから一覧を作り直す
        run: node tools/update-fsa-list.mjs rules/fsa-list.json
      - name: latest.json を作り直す（件数が少なすぎたら止める）
        run: node tools/make-latest.mjs
      - name: 変わっていたら反映する
        run: |
          if git diff --quiet; then
            echo "変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add rules
          git commit -m "金融庁の無登録業者リストを自動更新"
          git push
